<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mock</title><style>
:root{--bg:#f6f8fa;--card:#fff;--b:#d0d7de;--t:#1f2328;--m:#656d76;--red:#d1242f;--redbg:#ffebe9;--acc:#0969da;--accbg:#ddf4ff;--btn:#1f883d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--t);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7}
.card{max-width:500px;width:100%;background:var(--card);border:1px solid var(--b);border-radius:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--b);background:var(--bg);font-weight:600;font-size:14px}
.logo{width:30px;height:30px;border-radius:8px;background:#1f2328;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px}
.body{padding:36px 28px 28px;text-align:center}
.ic{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:var(--redbg);color:var(--red);display:grid;place-items:center}
h1{margin:0 0 8px;font-size:22px}.reason{color:var(--m);margin:0 0 24px}
.note{background:var(--accbg);border:1px solid rgba(9,105,218,.25);border-radius:8px;padding:14px 16px;text-align:right;font-size:14px}
.note b{display:block;margin-bottom:2px}
.actions{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:6px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-size:14px;font-weight:500;text-decoration:none}
.btn.p{background:var(--btn);border-color:var(--btn);color:#fff}
.foot{border-top:1px solid var(--b);padding:12px;text-align:center;font-size:12px;color:var(--m)}
</style></head><body><main class="card">
<div class="top"><span class="logo">QB</span>برمجيات كيوبي</div>
<div class="body"><div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><h1>تم إيقاف هذا الموقع</h1><p class="reason">الموقع متوقف مؤقتاً لأعمال الصيانة.</p>
<div class="note"><b>هذا الموقع يعمل بنظام من برمجيات كيوبي</b>تم إيقاف الخدمة حالياً. للاستفسار أو إعادة التشغيل يرجى التواصل مع الناشر: برمجيات كيوبي.</div>
<div class="actions"><a class="btn p" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg> تواصل عبر واتساب</a><a class="btn" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> البريد الإلكتروني</a></div></div>
<div class="foot">© برمجيات كيوبي · جميع الحقوق محفوظة</div></main></body></html>
