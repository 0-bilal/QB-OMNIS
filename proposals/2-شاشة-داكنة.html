<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mock</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:#0d1117;color:#e6edf3;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:640px;height:640px;top:-260px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(31,111,235,.35),transparent 65%);pointer-events:none}

h1{margin:0 0 10px;font-size:34px;font-weight:700}
.reason{color:#8d96a0;font-size:17px;margin:0 0 28px}
.sep{height:1px;background:linear-gradient(90deg,transparent,#30363d,transparent);margin:0 0 24px}
.txt{color:#c9d1d9;font-size:15px;margin:0 0 22px}.txt b{color:#fff}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;color:#e6edf3;border:1px solid #30363d;background:#21262d}
.btn.p{background:#238636;border-color:#2ea043;color:#fff}
footer{position:relative;z-index:1;margin-top:48px;color:#6e7681;font-size:12px}
</style></head><body><main>
